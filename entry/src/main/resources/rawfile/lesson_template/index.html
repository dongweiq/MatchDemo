<!doctype html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <style>
        * {
           margin: 0;
           padding: 0;
           box-sizing: border-box;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
           Oxygen,
           Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        }
        html,
        body {
           height: 100vh;
           width: 100vw;
        }
        #threejs-container{
           position: block;
           width: 100%;
           height: 100%;
        }
    </style>
    <script src="./includes/three.min.js"></script>
    <script src="./includes/utils.js"></script>
</head>
<body>
<div id="threejs-container">
    <!-- Our output to be rendered here -->
</div>
<script type="module">
    const params = getParams();
    console.log('state === 传递过来的参数：' + params['lesson_id']);

    const width = window.innerWidth;
    const height = window.innerHeight;

    try {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#00b140');

        // 相机。
        const fov = 45; // 又称视场
        const aspects = window.innerWidth / window.innerHeight;
        const near = 0.1; // 近裁剪面
        const far = 100; // 远裁剪面
        const camera = new THREE.PerspectiveCamera(fov, aspects, near, far);
        camera.position.set(0, 0, 10);

        // 渲染器。
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Creating a cube。
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshBasicMaterial({ wireframe: true });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // 渲染场景。
        const container = document.querySelector('#threejs-container');
        container.append(renderer.domElement);
        renderer.render(scene, camera);
    } catch (error) {
        console.log('state === 出现了异常：' + error);
    }
</script>
</body>
</html>
